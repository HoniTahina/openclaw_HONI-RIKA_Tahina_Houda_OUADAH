url: https://www.blogdumoderateur.com/articles/

pagination:
  pattern: "/articles/page/{n}/"
  start: 1
  max_pages: 5

selectors:
  titre: "main article h3.entry-title"

  url:
    selector: "main article a[href]"
    attr: href

  date:
    selector: "main article time[datetime]"
    attr: datetime

  categorie: "main article .favtag"

  chapeau: "main article .entry-excerpt"

fetcher:
  delay: 1.5
  retries: 3
  timeout: 15
  user_agent: "DataHarvest/1.0 (+contact@ipssi.fr)"

store:
  backend: sqlite
  path: output/articles.db