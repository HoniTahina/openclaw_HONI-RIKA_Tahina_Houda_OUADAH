# Site 3/5 -- Niveau 2
# Selecteurs verifies sur du vrai HTML (rendu Parsoid de Wikipedia).
#
# HISTORIQUE DES CORRECTIONS sur ce site (interessant pour le rapport) :
# 1. La cellule "drapeau" contient un lien /wiki/Fichier:Flag_of_XXX.svg
#    (l'image), pas le pays -> exclu via :not([href*='/wiki/Fichier:'])
# 2. Des notes de bas de page comme "[L]" sont aussi des liens /wiki/...
#    avec une ANCRE vers la meme page -> exclu via :not([href*='#'])
# 3. LE VRAI PROBLEME DE FOND : certaines cellules contiennent PLUSIEURS
#    liens vers le meme pays (nom courant + translitterations + noms
#    historiques, ex: Afghanistan / Afghānistān / Émirat islamique
#    d'Afghanistan). Le mode "a plat" de GenericPipeline (selection sur
#    toute la page + alignement par index) ne peut pas garantir "1 seul
#    lien par ligne" de facon fiable, meme avec des exclusions CSS
#    (:first-of-type echoue si les liens sont imbriques differemment).
#    RESOLU en activant le "row_selector" ci-dessous : nouveau mode
#    "par ligne" ajoute au framework (voir dataharvest/pipeline.py),
#    qui isole chaque <tr> et cherche chaque champ SEULEMENT dedans
#    (select_one), garantissant un seul resultat par ligne quelle que
#    soit l'imbrication.
#
# Pattern liste -> detail (extension du framework) : pour capitale et
# continent, l'Orchestrator visite la fiche de CHAQUE pays valide apres
# la page liste, via dataharvest/detail.py :
# - "capitale" utilise le mode label_lookup (cherche le <th> "Capitale")
# - "continent" utilise le mode category_pattern (categories Parsoid
#   "Portail:<Continent>/Articles_liés")

url: https://fr.wikipedia.org/wiki/Liste_des_pays_du_monde
row_selector: "table.wikitable tr"
pagination:
  pattern: null
  start: 1
  max_pages: 1
selectors:
  nom_court:
    selector: "td a[href^='https://fr.wikipedia.org/wiki/']:not([href*='/wiki/Fichier:']):not([href*='#'])"
    attr: text
  url:
    selector: "td a[href^='https://fr.wikipedia.org/wiki/']:not([href*='/wiki/Fichier:']):not([href*='#'])"
    attr: href
validator:
  required_fields: [nom_court, url]
detail:
  url_field: url
  selectors:
    capitale:
      mode: label_lookup
      label: "Capitale"
    continent:
      mode: category_pattern
      patterns:
        Afrique: "Portail:Afrique/Articles_li[ée]s"
        "Amérique du Nord": "Portail:Am[ée]rique_du_Nord/Articles_li[ée]s"
        "Amérique du Sud": "Portail:Am[ée]rique_du_Sud/Articles_li[ée]s"
        "Amérique centrale": "Portail:Am[ée]rique_centrale/Articles_li[ée]s"
        "Amérique": "Portail:Am[ée]rique/Articles_li[ée]s"
        Asie: "Portail:Asie/Articles_li[ée]s"
        Europe: "Portail:Europe/Articles_li[ée]s"
        "Océanie": "Portail:Oc[ée]anie/Articles_li[ée]s"
fetcher:
  delay: 1.0
  retries: 3
  timeout: 15
  user_agent: "DataHarvest/1.0 (+contact@ipssi.fr)"
store:
  backend: json
  path: output/pays_wikipedia.json