# Site 2/5 -- Niveau 1
# Limite connue : chaque citation peut avoir un NOMBRE VARIABLE de tags
# (1 a 5+), alors que GenericPipeline suppose un nombre fixe d'occurrences
# par champ (aligne index par index). On ne capture donc que le PREMIER
# tag de chaque citation via ":first-child" -- a documenter dans le
# rapport comme limite du modele de selection "plat".
#
# 'url' ne pointe pas vers une fiche citation (qui n'existe pas), mais
# vers la page bio de l'auteur (lien "(about)"), seul lien disponible par
# citation -- necessaire car Validator exige un champ 'url'.

url: https://quotes.toscrape.com/
pagination:
  pattern: "page/{n}/"
  start: 1
  max_pages: 5
selectors:
  citation: "div.quote span.text"
  auteur: "div.quote small.author"
  url:
    selector: "div.quote > span > a"
    attr: href
  tag: "div.quote div.tags a.tag:first-child"
fetcher:
  delay: 1.0
  retries: 3
  timeout: 15
  user_agent: "DataHarvest/1.0 (+contact@ipssi.fr)"
store:
  backend: json
  path: output/quotes.json
