# Exemple fourni tel quel dans le sujet du projet.
#
# ATTENTION : ces selecteurs (h2.post-title, .cat-links) sont ceux donnes
# par l'enonce, mais n'ont pas ete verifies contre le HTML reel actuel du
# site (verification faite dans un TP anterieur sur blogdumoderateur.com,
# qui utilise en realite header.entry-header h3.entry-title, .favtag,
# .entry-excerpt). AVANT de compter sur ce fichier pour le test
# d'integration, lance :
#
#   python -m dataharvest crawl --config configs/example_blog.yaml --dry-run
#
# Si les items sortent vides, inspecte le vrai HTML du site (clic droit ->
# Inspecter) et ajuste les selecteurs ci-dessous en consequence.

url: https://www.blogdumoderateur.com/
pagination:
  pattern: /page/{n}/
  start: 1
  max_pages: 5
selectors:
  titre: h2.post-title a
  url: h2.post-title a
  date: "time[datetime]"
  categorie: .cat-links a
fetcher:
  delay: 1.5
  retries: 3
  timeout: 15
  user_agent: "DataHarvest/1.0 (+contact@ipssi.fr)"
store:
  backend: sqlite
  path: output/articles.db
